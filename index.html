<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard · Open-Meteo</title>
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gradient-to-br from-slate-800 to-slate-900 min-h-screen flex items-center justify-center p-4 font-sans antialiased">

    <div class="w-full max-w-4xl bg-white/10 backdrop-blur-md rounded-3xl shadow-2xl p-6 md:p-8 border border-white/20 text-white transition-all duration-300">

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mb-6">

            <h1 class="text-3xl font-extralight tracking-wide flex items-center gap-2">
                <i class="fas fa-cloud-sun text-amber-300"></i>
                <span class="font-medium">weather</span>board
            </h1>

            <div class="flex w-full sm:w-auto gap-2">

                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search city… e.g. London"
                    class="flex-1 sm:w-56 px-4 py-2 rounded-full bg-white/20 border border-white/30 text-white placeholder:text-white/60 focus:outline-none focus:ring-2 focus:ring-amber-300/70 transition"
                    autofocus>

                <button
                    id="searchBtn"
                    class="px-5 py-2 bg-amber-400 hover:bg-amber-300 text-slate-900 font-medium rounded-full transition shadow-lg shadow-amber-400/30 flex items-center gap-2">

                    <i class="fas fa-magnifying-glass"></i>
                    Go

                </button>

            </div>

        </div>

        <div id="appContainer">

            <!-- Idle State -->
            <div id="idleState" class="text-center py-16 px-4">

                <i class="fas fa-map-location-dot text-6xl text-white/30 mb-4"></i>

                <p class="text-xl text-white/60">
                    Search for a city to see the weather
                </p>

                <p class="text-sm text-white/40 mt-2">
                    Powered by Open-Meteo · free & no API key
                </p>

            </div>

            <!-- Loading -->
            <div id="loadingState" class="text-center py-16 hidden">

                <i class="fas fa-spinner fa-spin text-5xl text-amber-300 mb-4"></i>

                <p class="text-xl text-white/70">
                    Loading forecast…
                </p>

            </div>

            <!-- Error -->
            <div id="errorState" class="text-center py-16 hidden">

                <i class="fas fa-circle-exclamation text-5xl text-rose-400 mb-4"></i>

                <p id="errorMessage" class="text-xl text-rose-200">
                    Something went wrong
                </p>

                <p class="text-sm text-white/50 mt-2">
                    Please try a different city
                </p>

            </div>

            <!-- Weather Display -->
            <div id="weatherDisplay" class="hidden">

                <!-- Today -->
                <div class="bg-white/10 rounded-2xl p-5 mb-6 backdrop-blur-sm border border-white/10">

                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center">

                        <div>

                            <h2 id="cityName" class="text-3xl font-semibold">
                                City
                            </h2>

                            <p id="currentDate" class="text-white/60 text-sm mt-1">
                                Today
                            </p>

                            <div class="flex items-center gap-3 mt-2">

                                <span id="currentTemp" class="text-5xl font-light">
                                    --°C
                                </span>

                                <span id="weatherDescription"
                                    class="text-lg bg-white/20 px-3 py-1 rounded-full">
                                    --
                                </span>

                            </div>

                        </div>

                        <div class="mt-3 md:mt-0 flex items-center gap-4 text-sm">

                            <div>
                                <i class="fas fa-droplet text-cyan-300 mr-1"></i>
                                <span id="humidity">--</span>%
                            </div>

                            <div>
                                <i class="fas fa-wind text-sky-300 mr-1"></i>
                                <span id="windSpeed">--</span> km/h
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Forecast -->
                <h3 class="text-xl font-light mb-3 flex items-center gap-2">

                    <i class="fas fa-calendar-week text-amber-300"></i>

                    5-day Forecast

                </h3>

                <div id="forecastGrid"
                    class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">

                    <!-- Generated by JavaScript -->

                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="text-center text-white/30 text-xs mt-6 border-t border-white/10 pt-4">

            <i class="fas fa-code"></i>

            ES Modules · Async/Await · Open-Meteo

        </div>

    </div>

    <script src="js/api.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>

</body>
</html>
